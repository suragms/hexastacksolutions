<!doctype html>
<html lang="en-IN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Canonical host: use www everywhere (matches site.ts JSON-LD, sitemap, Search Console). Redirect apex → www in hosting DNS.
         NOTE: canonical / description / og / twitter tags are intentionally NOT hardcoded here. scripts/prerender.cjs
         renders each route headless and writes per-route static HTML into dist/<route>/index.html, with the values
         usePageSeo / SEO.tsx set already baked in; the client-side hooks cover SPA-routed pages. Hardcoding them here
         would create duplicate tags in the prerendered output, which hurts SEO. -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-new.png" />
    <link rel="shortcut icon" href="/favicon-new.png" />
    <link rel="apple-touch-icon" href="/brand-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <!-- Google Search Console: add property for https://www.hexastacksolutions.com then paste verification meta from GSC:
    <meta name="google-site-verification" content="PASTE_FROM_GSC" />
    -->
    <meta name="google-site-verification" content="WMjF2f8_2yH5H-XydiKtRwcpu4B4uyIjDNJbJ9Yh6tg" />
    <meta
      name="keywords"
      content="web development company Kerala, software company Thrissur, mobile app development Kerala, ERP software Kerala, AI automation company Kerala, SEO company Kerala"
    />
    <meta name="geo.region" content="IN-KL" />
    <meta name="geo.placename" content="Thrissur, Kerala, India" />
    <meta name="geo.position" content="10.787;76.23" />
    <meta name="ICBM" content="10.787, 76.23" />
    <meta name="author" content="HexaStack Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- One href per language; avoid duplicate hreflang URLs (same page for every region hurts Lighthouse SEO). -->
    <link rel="alternate" hreflang="en-IN" href="https://www.hexastacksolutions.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.hexastacksolutions.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (reduces render-blocking vs synchronous stylesheet). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Web Development & AI Automation Company in Kerala | HexaStack Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
